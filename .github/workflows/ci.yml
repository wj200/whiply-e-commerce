name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whiply
          POSTGRES_PASSWORD: whiply
          POSTGRES_DB: whiply_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://whiply:whiply@localhost:5432/whiply_test
      DIRECT_DATABASE_URL: postgresql://whiply:whiply@localhost:5432/whiply_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
